name: FSPlayerDemoApp
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: none

targets:
  FSPlayerDemoApp:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: FSPlayerDemo
        excludes:
          - "XCAssets/**"
          # 老式 asset catalog（iOS7 时代 launchimage / 缺少对应图片的 appiconset）会被
          # Xcode 26 的 actool 判为失败，这里整体排除；启动图改用 LaunchScreen.xib，
          # 图标留空（Sideloadly 装完后是默认图标），先保证能编出可安装的 IPA。
          - "Images.xcassets"
          - "AppIcons.xcassets"
          - "FSPlayerDemo-Info.plist"
          - "FSPlayerDemo.pch"
    settings:
      base:
        PRODUCT_NAME: FSPlayerDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.fsplayer
        INFOPLIST_FILE: FSPlayerDemo/FSPlayerDemo-Info.plist
        PREFIX_HEADER: FSPlayerDemo/FSPlayerDemo.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - framework: FSPlayer.xcframework
        embed: true
        codeSign: false
