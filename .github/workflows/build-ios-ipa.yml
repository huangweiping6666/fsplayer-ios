name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Target to build'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - framework

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install XcodeGen
      run: |
        brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        echo "Generating Xcode project with XcodeGen..."
        chmod +x generate-proj.sh
        ./generate-proj.sh
        
        echo "Checking generated projects..."
        ls -la *.xcodeproj || true
        ls -la examples/ios/*.xcodeproj || true
    
    - name: Build Framework
      if: github.event.inputs.scheme == 'framework' || github.event.inputs.scheme == 'demo'
      run: |
        cd examples/ios
        
        echo "Building FSPlayer framework..."
        ./build-framework.sh
        
        echo "Framework built successfully"
        ls -la FSPlayer-iOS.framework || true
    
    - name: Build Demo IPA
      if: github.event.inputs.scheme == 'demo'
      run: |
        cd examples/ios
        
        echo "Building FSPlayerDemo..."
        
        # 构建 Archive（不签名）
        xcodebuild archive \
          -project FSPlayerDemo.xcodeproj \
          -scheme FSPlayerDemo \
          -configuration Release \
          -archivePath build/FSPlayerDemo.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates
        
        # 打包成 IPA
        echo "Creating unsigned IPA..."
        cd build/FSPlayerDemo.xcarchive/Products/Applications
        mkdir Payload
        cp -r FSPlayerDemo.app Payload/
        zip -r ../../../../FSPlayerDemo-unsigned.ipa Payload
        cd ../../../..
        
        echo "IPA created successfully"
        ls -lh FSPlayerDemo-unsigned.ipa
    
    - name: Upload Framework
      if: github.event.inputs.scheme == 'framework'
      uses: actions/upload-artifact@v4
      with:
        name: FSPlayer-Framework
        path: examples/ios/FSPlayer-iOS.framework
        retention-days: 7
    
    - name: Upload Demo IPA
      if: github.event.inputs.scheme == 'demo'
      uses: actions/upload-artifact@v4
      with:
        name: FSPlayerDemo-iOS
        path: examples/ios/FSPlayerDemo-unsigned.ipa
        retention-days: 7
