name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode Scheme to build'
        required: true
        default: 'AuraPlayer'
        type: choice
        options:
          - AuraPlayer
          - FSPlayer

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Generate Xcode Project
      run: |
        chmod +x generate-proj.sh
        ./generate-proj.sh
    
    - name: List Available Schemes
      run: |
        cd examples/ios
        xcodebuild -list -project AuraPlayer.xcodeproj
    
    - name: Build IPA
      run: |
        cd examples/ios
        
        # 创建导出配置
        cat > exportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>RSJCUT9MB9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>cn.debugly.AuraPlayer</key>
                <string>iOS Team Provisioning Profile</string>
            </dict>
        </dict>
        </plist>
        EOF
        
        # 构建 Archive
        xcodebuild archive \
          -project AuraPlayer.xcodeproj \
          -scheme "${{ github.event.inputs.scheme }}" \
          -configuration Release \
          -archivePath build/AuraPlayer.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
        
        # 导出 IPA
        xcodebuild -exportArchive \
          -archivePath build/AuraPlayer.xcarchive \
          -exportPath build \
          -exportOptionsPlist exportOptions.plist || true
        
        # 如果导出失败，直接打包 .app
        if [ ! -f build/*.ipa ]; then
          echo "Direct IPA export failed, creating unsigned IPA from .app"
          cd build/AuraPlayer.xcarchive/Products/Applications
          mkdir Payload
          cp -r AuraPlayer.app Payload/
          zip -r ../../../../AuraPlayer-unsigned.ipa Payload
          cd ../../../..
        fi
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: AuraPlayer-iOS
        path: |
          examples/ios/build/*.ipa
          examples/ios/build/AuraPlayer.xcarchive/Products/Applications/AuraPlayer.app
        retention-days: 7
