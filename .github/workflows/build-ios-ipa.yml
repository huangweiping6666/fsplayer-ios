name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode Scheme to build'
        required: true
        default: 'FSPlayerDemo'
        type: choice
        options:
          - FSPlayerDemo
          - FSPlayer

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: List Available Schemes
      run: |
        cd examples/ios
        echo "=== Available Projects ==="
        ls -la *.xcodeproj
        echo ""
        echo "=== FSPlayer Schemes ==="
        xcodebuild -list -project FSPlayer.xcodeproj || true
        echo ""
        echo "=== FSPlayerDemo Schemes ==="
        xcodebuild -list -project FSPlayerDemo.xcodeproj || true
    
    - name: Build IPA
      run: |
        cd examples/ios
        
        # 根据用户选择的 scheme 确定项目
        if [[ "${{ github.event.inputs.scheme }}" == "FSPlayerDemo" ]]; then
          PROJECT="FSPlayerDemo.xcodeproj"
          SCHEME="FSPlayerDemo"
        else
          PROJECT="FSPlayer.xcodeproj"
          SCHEME="FSPlayer"
        fi
        
        echo "Building $SCHEME from $PROJECT"
        
        # 构建 Archive（不签名）
        xcodebuild archive \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -configuration Release \
          -archivePath build/App.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates
        
        # 打包成 IPA
        echo "Creating unsigned IPA..."
        cd build/App.xcarchive/Products/Applications
        mkdir Payload
        cp -r *.app Payload/
        zip -r ../../../../${SCHEME}-unsigned.ipa Payload
        cd ../../../..
        
        echo "IPA created: ${SCHEME}-unsigned.ipa"
        ls -lh *.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.scheme }}-iOS
        path: examples/ios/*.ipa
        retention-days: 7
